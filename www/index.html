<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BcodStore Admin</title>
<link rel="icon" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script>
  (function(){
    var saved = localStorage.getItem('bcodstore_theme') || 'light';
    document.documentElement.setAttribute('data-theme', saved);
  })();
  window.__tryLogo = function(img, remaining){
    if (!remaining || !remaining.length){ img.style.display = 'none'; return; }
    var next = remaining.shift();
    img.onerror = function(){ window.__tryLogo(img, remaining); };
    img.src = next;
  };
</script>
<style>
  :root{
    --bg:#F6F7F9;
    --surface:#FFFFFF;
    --surface-2:#EEF1F5;
    --text:#141A21;
    --text-dim:#6B7684;
    --accent:#FFB020;
    --accent-ink:#1A1200;
    --danger:#E5484D;
    --line:#E3E7EC;
    --glass-bg:rgba(255,255,255,0.55);
    --glass-border:rgba(255,255,255,0.65);
    --glass-blur:18px;
    --blob-1:rgba(255,176,32,0.16);
    --blob-2:rgba(80,140,255,0.14);
  }
  [data-theme="dark"]{
    --bg:#0F1720;
    --surface:#172432;
    --surface-2:#1E2C3D;
    --text:#EDEEF0;
    --text-dim:#8A94A6;
    --line:#243244;
    --glass-bg:rgba(23,36,50,0.55);
    --glass-border:rgba(255,255,255,0.08);
    --blob-1:rgba(255,176,32,0.10);
    --blob-2:rgba(80,140,255,0.10);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;background:var(--bg);color:var(--text);
    font-family:'Inter',sans-serif;min-height:100vh;
    position:relative;transition:background-color .2s ease,color .2s ease;
  }
  body::before{
    content:'';position:fixed;inset:0;z-index:-1;
    background:
      radial-gradient(circle at 15% 10%, var(--blob-1), transparent 40%),
      radial-gradient(circle at 85% 30%, var(--blob-2), transparent 38%),
      radial-gradient(circle at 30% 90%, var(--blob-2), transparent 35%);
  }
  h1,h2{font-family:'Space Grotesk',sans-serif;}
  input,textarea{
    width:100%;background:var(--surface);border:1px solid var(--line);
    color:var(--text);padding:10px 12px;border-radius:8px;
    font-family:'Inter',sans-serif;font-size:14px;outline:none;
  }
  input:focus,textarea:focus{border-color:var(--accent);}
  label{font-size:12px;color:var(--text-dim);display:block;margin:14px 0 6px;}
  label:first-child{margin-top:0;}
  button{font-family:'Inter',sans-serif;cursor:pointer;border:none;}

  /* ---- Login ---- */
  .login-screen{
    min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;
  }
  .login-box{
    width:100%;max-width:340px;
    background:var(--glass-bg);backdrop-filter:blur(var(--glass-blur));
    -webkit-backdrop-filter:blur(var(--glass-blur));
    border:1px solid var(--glass-border);border-radius:14px;padding:28px 24px;
  }
  .login-box .brand{margin-bottom:6px;}
  .login-box p{color:var(--text-dim);font-size:13px;margin:0 0 20px;}
  .login-btn{
    width:100%;margin-top:18px;background:var(--accent);color:var(--accent-ink);
    font-weight:600;padding:11px;border-radius:8px;font-size:14px;
  }
  .error-msg{color:var(--danger);font-size:13px;margin-top:10px;min-height:16px;}

  /* ---- Brand badge (fixed colors, same in both themes) ---- */
  .brand{
    display:inline-flex;align-items:center;gap:7px;
    background:#10151C;
    padding:7px 13px 7px 8px;
    border-radius:999px;
    border:1px solid rgba(255,255,255,0.08);
    font-size:15px;font-weight:700;
  }
  .brand img{width:26px;height:26px;border-radius:7px;object-fit:cover;flex-shrink:0;}
  .brand .bcod-part{color:#FFFFFF;}
  .brand .store-part{color:#F4C542;}
  .brand-logo-wrap{
    position:relative;width:26px;height:26px;border-radius:7px;
    overflow:hidden;flex-shrink:0;
    background:linear-gradient(135deg, var(--accent), #FFC94D);
  }
  .brand-logo-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:2;}
  .brand-logo-fallback{
    position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    z-index:1;
  }
  .brand-logo-fallback svg{width:60%;height:60%;}

  /* ---- Dashboard ---- */
  .topbar{
    display:flex;align-items:center;justify-content:space-between;
    padding:12px 20px;
    background:var(--glass-bg);backdrop-filter:blur(var(--glass-blur));
    -webkit-backdrop-filter:blur(var(--glass-blur));
    border-bottom:1px solid var(--glass-border);
    position:sticky;top:0;z-index:5;
  }
  .topbar-actions{display:flex;align-items:center;gap:8px;}
  .theme-toggle{
    width:34px;height:34px;border-radius:50%;
    background:var(--glass-bg);border:1px solid var(--glass-border);
    display:flex;align-items:center;justify-content:center;
    font-size:15px;
  }
  .logout-btn{
    background:var(--surface);color:var(--text);border:1px solid var(--line);
    padding:8px 14px;border-radius:8px;font-size:13px;
  }
  .layout{
    max-width:1000px;margin:0 auto;padding:20px;
    display:grid;grid-template-columns:340px 1fr;gap:20px;
  }
  @media (max-width:800px){ .layout{grid-template-columns:1fr;} }

  .panel{
    background:var(--glass-bg);backdrop-filter:blur(var(--glass-blur));
    -webkit-backdrop-filter:blur(var(--glass-blur));
    border:1px solid var(--glass-border);
    border-radius:14px;padding:18px;
  }
  .panel h2{font-size:15px;margin:0 0 4px;}
  .panel-sub{color:var(--text-dim);font-size:12px;margin:0 0 4px;}

  .checkbox-row{display:flex;align-items:center;gap:8px;margin-top:14px;}
  .checkbox-row input{width:auto;}
  .checkbox-row label{margin:0;font-size:13px;color:var(--text);}

  .form-actions{display:flex;gap:8px;margin-top:18px;}
  .btn-primary{
    flex:1;background:var(--accent);color:var(--accent-ink);
    font-weight:600;padding:11px;border-radius:8px;font-size:14px;
  }
  .btn-secondary{
    background:var(--surface-2);color:var(--text);
    padding:11px 14px;border-radius:8px;font-size:14px;border:1px solid var(--line);
  }
  .form-msg{font-size:12px;margin-top:10px;min-height:14px;}
  .form-msg.ok{color:#2FAF63;}
  .form-msg.err{color:var(--danger);}

  #appList{position:relative;}
  .app-row{
    display:flex;gap:10px;align-items:center;
    padding:10px 0;border-bottom:1px solid var(--line);
    background:var(--bg);
    touch-action:pan-y;
  }
  .app-row:last-child{border-bottom:none;}
  .app-row.dragging{
    position:relative;z-index:50;
    box-shadow:0 8px 24px rgba(0,0,0,0.18);
    border-radius:10px;
    background:var(--surface);
  }
  .drag-handle{
    width:26px;height:34px;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;
    color:var(--text-dim);font-size:16px;letter-spacing:2px;
    cursor:grab;touch-action:none;user-select:none;
  }
  .app-row img{
    width:44px;height:44px;border-radius:22%;object-fit:cover;
    background:var(--surface-2);border:1px solid var(--line);flex-shrink:0;
  }
  .app-row .info{flex:1;min-width:0;}
  .app-row .info .name{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .app-row .info .meta{font-size:12px;color:var(--text-dim);}
  .app-row .actions{display:flex;gap:6px;flex-shrink:0;}
  .icon-btn{
    width:30px;height:30px;border-radius:7px;
    background:var(--surface-2);border:1px solid var(--line);color:var(--text);
    font-size:13px;display:flex;align-items:center;justify-content:center;
  }
  .icon-btn.danger{color:var(--danger);}
  .banner-tag{
    font-size:10px;background:var(--accent);color:var(--accent-ink);
    padding:2px 6px;border-radius:5px;font-weight:600;margin-left:6px;
  }
  .empty-list{color:var(--text-dim);font-size:13px;padding:20px 0;text-align:center;}
</style>
</head>
<body>

<!-- LOGIN SCREEN -->
<div class="login-screen" id="loginScreen">
  <div class="login-box">
    <div class="brand">
      <span class="brand-logo-wrap">
        <img src="logo.png" alt="" class="brand-logo-img" onerror="window.__tryLogo(this, ['./logo.png','Logo.png','LOGO.png','logo.PNG','logo.jpg','logo.jpeg','logo.svg'])">
        <span class="brand-logo-fallback">
          <svg viewBox="0 0 24 24" fill="none" stroke="#1A1200" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 4v10"/>
            <path d="M8 10l4 4 4-4"/>
            <path d="M6 18h12"/>
          </svg>
        </span>
      </span>
      <span class="bcod-part">Bcod</span><span class="store-part">Store</span>
    </div>
    <p>Admin sign in</p>
    <label>Email</label>
    <input type="email" id="loginEmail" placeholder="you@example.com">
    <label>Password</label>
    <input type="password" id="loginPassword" placeholder="••••••••">
    <button class="login-btn" id="loginBtn">Sign in</button>
    <div class="error-msg" id="loginError"></div>
  </div>
</div>

<!-- DASHBOARD -->
<div id="dashboard" style="display:none;">
  <div class="topbar">
    <div class="brand">
      <span class="brand-logo-wrap">
        <img src="logo.png" alt="" class="brand-logo-img" onerror="window.__tryLogo(this, ['./logo.png','Logo.png','LOGO.png','logo.PNG','logo.jpg','logo.jpeg','logo.svg'])">
        <span class="brand-logo-fallback">
          <svg viewBox="0 0 24 24" fill="none" stroke="#1A1200" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 4v10"/>
            <path d="M8 10l4 4 4-4"/>
            <path d="M6 18h12"/>
          </svg>
        </span>
      </span>
      <span class="bcod-part">Bcod</span><span class="store-part">Store</span>
    </div>
    <div class="topbar-actions">
      <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme">🌙</button>
      <button class="logout-btn" id="logoutBtn">Sign out</button>
    </div>
  </div>

  <div class="layout">
    <!-- FORM PANEL -->
    <div class="panel">
      <h2 id="formTitle">Add new app</h2>
      <p class="panel-sub">Fields marked with an asterisk are required.</p>

      <label>App name *</label>
      <input type="text" id="fName" placeholder="e.g. My App">

      <label>Logo URL *</label>
      <input type="text" id="fLogo" placeholder="https://...">

      <label>Download URL (APK link) *</label>
      <input type="text" id="fApk" placeholder="https://...">

      <label>Download password (optional)</label>
      <input type="text" id="fPassword" placeholder="Leave empty if not needed">

      <label>Size (MB) *</label>
      <input type="number" id="fSize" placeholder="e.g. 25">

      <label>Description</label>
      <textarea id="fDesc" rows="3" placeholder="What this app does"></textarea>

      <label>Screenshot URLs (one per line)</label>
      <textarea id="fShots" rows="3" placeholder="https://...&#10;https://..."></textarea>

      <div class="checkbox-row">
        <input type="checkbox" id="fBanner">
        <label for="fBanner">Show as banner on home page</label>
      </div>

      <label>Banner image URL (optional, defaults to logo)</label>
      <input type="text" id="fBannerImg" placeholder="https://...">

      <div class="form-actions">
        <button class="btn-primary" id="saveBtn">Save app</button>
        <button class="btn-secondary" id="cancelEditBtn" style="display:none;">Cancel</button>
      </div>
      <div class="form-msg" id="formMsg"></div>
    </div>

    <!-- LIST PANEL -->
    <div class="panel">
      <h2>All apps</h2>
      <p class="panel-sub">Press and hold the ⠿ handle to drag an app into a new position.</p>
      <div id="appList"></div>
      <div class="empty-list" id="emptyList" hidden>No apps added yet.</div>
    </div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getFirestore, collection, query, orderBy, onSnapshot,
  addDoc, doc, updateDoc, deleteDoc, serverTimestamp, writeBatch
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import {
  getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyB-6sCgwBLlR8Rou_-3egpCJwuhy1hwijo",
  authDomain: "bcodstore-e6204.firebaseapp.com",
  projectId: "bcodstore-e6204",
  storageBucket: "bcodstore-e6204.firebasestorage.app",
  messagingSenderId: "1054943264169",
  appId: "1:1054943264169:web:c02fea3197fb841b9898b8"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

let allApps = [];
let editingId = null;

// ---------- Theme ----------
const themeToggle = document.getElementById('themeToggle');
function currentTheme(){ return document.documentElement.getAttribute('data-theme') || 'light'; }
function setTheme(theme){
  document.documentElement.setAttribute('data-theme', theme);
  localStorage.setItem('bcodstore_theme', theme);
  themeToggle.textContent = theme === 'dark' ? '☀️' : '🌙';
}
setTheme(currentTheme());
themeToggle.addEventListener('click', () => setTheme(currentTheme() === 'light' ? 'dark' : 'light'));

// ---------- Auth ----------
const loginScreen = document.getElementById('loginScreen');
const dashboard = document.getElementById('dashboard');

onAuthStateChanged(auth, (user) => {
  if (user){
    loginScreen.style.display = 'none';
    dashboard.style.display = 'block';
    startListening();
  } else {
    loginScreen.style.display = 'flex';
    dashboard.style.display = 'none';
  }
});

document.getElementById('loginBtn').addEventListener('click', async () => {
  const email = document.getElementById('loginEmail').value.trim();
  const password = document.getElementById('loginPassword').value;
  const errEl = document.getElementById('loginError');
  errEl.textContent = '';
  try {
    await signInWithEmailAndPassword(auth, email, password);
  } catch (e){
    errEl.textContent = 'Incorrect email or password.';
  }
});

document.getElementById('logoutBtn').addEventListener('click', () => signOut(auth));

// ---------- Firestore listener ----------
let unsub = null;
function startListening(){
  if (unsub) return;
  const q = query(collection(db, 'apps'), orderBy('order', 'asc'));
  unsub = onSnapshot(q, (snap) => {
    if (dragState.active) return; // don't let remote updates fight an in-progress drag
    allApps = [];
    snap.forEach(d => allApps.push({ id: d.id, ...d.data() }));
    renderList();
  });
}

function renderList(){
  const listEl = document.getElementById('appList');
  const emptyEl = document.getElementById('emptyList');
  listEl.innerHTML = '';
  emptyEl.hidden = allApps.length !== 0;

  allApps.forEach((a) => {
    const row = document.createElement('div');
    row.className = 'app-row';
    row.dataset.id = a.id;
    row.innerHTML = `
      <div class="drag-handle">⠿</div>
      <img src="${escapeAttr(a.logoUrl || '')}" alt="">
      <div class="info">
        <div class="name">${escapeHtml(a.name || 'Untitled')}${a.isBanner ? '<span class="banner-tag">BANNER</span>' : ''}</div>
        <div class="meta">${a.sizeMB ? a.sizeMB + ' MB' : ''}</div>
      </div>
      <div class="actions">
        <button class="icon-btn" data-act="edit">✎</button>
        <button class="icon-btn danger" data-act="delete">✕</button>
      </div>
    `;
    row.querySelector('[data-act="edit"]').addEventListener('click', () => loadForEdit(a));
    row.querySelector('[data-act="delete"]').addEventListener('click', () => deleteApp(a));
    row.querySelector('.drag-handle').addEventListener('pointerdown', (e) => onDragStart(e, a.id));
    listEl.appendChild(row);
  });
}

// ---------- Drag to reorder ----------
const dragState = { active: false, id: null, startY: 0 };

function onDragStart(e, id){
  e.preventDefault();
  dragState.active = true;
  dragState.id = id;
  dragState.startY = e.clientY;
  const row = document.querySelector(`.app-row[data-id="${cssEscape(id)}"]`);
  if (row) row.classList.add('dragging');
  document.body.style.userSelect = 'none';
  window.addEventListener('pointermove', onDragMove);
  window.addEventListener('pointerup', onDragEnd);
}

function onDragMove(e){
  if (!dragState.active) return;
  const row = document.querySelector(`.app-row[data-id="${cssEscape(dragState.id)}"]`);
  if (!row) return;
  const deltaY = e.clientY - dragState.startY;
  row.style.transform = `translateY(${deltaY}px)`;

  const rowHeight = row.offsetHeight;
  const currentIndex = allApps.findIndex(a => a.id === dragState.id);
  let newIndex = currentIndex + Math.round(deltaY / rowHeight);
  newIndex = Math.max(0, Math.min(allApps.length - 1, newIndex));

  if (newIndex !== currentIndex){
    const [moved] = allApps.splice(currentIndex, 1);
    allApps.splice(newIndex, 0, moved);
    dragState.startY = e.clientY;
    renderList();
    const newRow = document.querySelector(`.app-row[data-id="${cssEscape(dragState.id)}"]`);
    if (newRow) newRow.classList.add('dragging');
  }
}

async function onDragEnd(){
  if (!dragState.active) return;
  const row = document.querySelector(`.app-row[data-id="${cssEscape(dragState.id)}"]`);
  if (row){ row.classList.remove('dragging'); row.style.transform = ''; }
  document.body.style.userSelect = '';
  window.removeEventListener('pointermove', onDragMove);
  window.removeEventListener('pointerup', onDragEnd);

  dragState.active = false;
  dragState.id = null;

  const batch = writeBatch(db);
  let changed = false;
  allApps.forEach((a, idx) => {
    if (a.order !== idx){
      batch.update(doc(db, 'apps', a.id), { order: idx });
      a.order = idx;
      changed = true;
    }
  });
  if (changed){
    try { await batch.commit(); } catch (e){ console.error('Reorder failed:', e); }
  }
}

function cssEscape(str){
  return String(str).replace(/["\\]/g, '\\$&');
}

async function deleteApp(a){
  if (!confirm(`Delete "${a.name}"? This cannot be undone.`)) return;
  await deleteDoc(doc(db, 'apps', a.id));
  if (editingId === a.id) resetForm();
}

function loadForEdit(a){
  editingId = a.id;
  document.getElementById('formTitle').textContent = 'Edit app';
  document.getElementById('fName').value = a.name || '';
  document.getElementById('fLogo').value = a.logoUrl || '';
  document.getElementById('fApk').value = a.apkUrl || '';
  document.getElementById('fPassword').value = a.downloadPassword || '';
  document.getElementById('fSize').value = a.sizeMB || '';
  document.getElementById('fDesc').value = a.description || '';
  document.getElementById('fShots').value = (a.screenshots || []).join('\n');
  document.getElementById('fBanner').checked = !!a.isBanner;
  document.getElementById('fBannerImg').value = a.bannerImageUrl || '';
  document.getElementById('saveBtn').textContent = 'Update app';
  document.getElementById('cancelEditBtn').style.display = 'inline-block';
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function resetForm(){
  editingId = null;
  document.getElementById('formTitle').textContent = 'Add new app';
  document.getElementById('fName').value = '';
  document.getElementById('fLogo').value = '';
  document.getElementById('fApk').value = '';
  document.getElementById('fPassword').value = '';
  document.getElementById('fSize').value = '';
  document.getElementById('fDesc').value = '';
  document.getElementById('fShots').value = '';
  document.getElementById('fBanner').checked = false;
  document.getElementById('fBannerImg').value = '';
  document.getElementById('saveBtn').textContent = 'Save app';
  document.getElementById('cancelEditBtn').style.display = 'none';
  document.getElementById('formMsg').textContent = '';
}

document.getElementById('cancelEditBtn').addEventListener('click', resetForm);

document.getElementById('saveBtn').addEventListener('click', async () => {
  const msgEl = document.getElementById('formMsg');
  const name = document.getElementById('fName').value.trim();
  const logoUrl = document.getElementById('fLogo').value.trim();
  const apkUrl = document.getElementById('fApk').value.trim();
  const downloadPassword = document.getElementById('fPassword').value.trim();
  const sizeMB = parseFloat(document.getElementById('fSize').value);
  const description = document.getElementById('fDesc').value.trim();
  const screenshots = document.getElementById('fShots').value
    .split('\n').map(s => s.trim()).filter(Boolean);
  const isBanner = document.getElementById('fBanner').checked;
  const bannerImageUrl = document.getElementById('fBannerImg').value.trim();

  if (!name || !logoUrl || !apkUrl || isNaN(sizeMB)){
    msgEl.textContent = 'Please fill in all required fields.';
    msgEl.className = 'form-msg err';
    return;
  }

  const data = { name, logoUrl, apkUrl, downloadPassword, sizeMB, description, screenshots, isBanner, bannerImageUrl };

  try {
    if (editingId){
      await updateDoc(doc(db, 'apps', editingId), data);
      msgEl.textContent = 'App updated.';
    } else {
      const maxOrder = allApps.reduce((m, a) => Math.max(m, a.order || 0), 0);
      await addDoc(collection(db, 'apps'), { ...data, order: maxOrder + 1, createdAt: serverTimestamp() });
      msgEl.textContent = 'App added.';
    }
    msgEl.className = 'form-msg ok';
    resetForm();
  } catch (e){
    console.error(e);
    msgEl.textContent = 'Something went wrong. Please try again.';
    msgEl.className = 'form-msg err';
  }
});

function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, (m) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
function escapeAttr(str){ return escapeHtml(str); }
</script>
</body>
</html>
