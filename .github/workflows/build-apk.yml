name: Build APK

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: 'App Name'
        required: true
      app_id:
        description: 'Package Name'
        required: true
      version_name:
        description: 'Version Name'
        required: false
        default: '1.0'
      version_code:
        description: 'Version Code'
        required: false
        default: '1'
      source_type:
        description: 'html or url'
        required: false
        default: 'html'
      website_url:
        description: 'Website URL (if source_type=url)'
        required: false
        default: ''
      fullscreen:
        description: 'Fullscreen / hide status bar'
        required: false
        default: 'false'
      exit_confirmation:
        description: 'Ask before exiting app'
        required: false
        default: 'false'
      dark_mode:
        description: 'Inject dark mode meta tag'
        required: false
        default: 'false'
      pc_mode:
        description: 'Use desktop user-agent'
        required: false
        default: 'false'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Print toolchain versions (diagnostics)
        run: |
          echo "JAVA_HOME=$JAVA_HOME"
          java -version
          node -v
          npm -v

      - name: Ensure base project files exist (fresh repo support)
        run: |
          mkdir -p www
          if [ ! -f www/index.html ]; then
            echo "<html><body>Hello</body></html>" > www/index.html
          fi
          if [ ! -f package.json ]; then
            npm init -y
          fi
          if [ ! -f capacitor.config.json ]; then
            cat > capacitor.config.json << 'EOF'
          {
            "appId": "com.placeholder.app",
            "appName": "Placeholder",
            "webDir": "www"
          }
          EOF
          fi

      - name: Pin Capacitor to a stable version (avoid JDK 21 requirement)
        run: |
          npm install @capacitor/core@6.2.1 @capacitor/cli@6.2.1 @capacitor/android@6.2.1 --save-exact

      - name: Inject dark mode meta tag into local HTML
        if: ${{ inputs.source_type == 'html' && inputs.dark_mode == 'true' }}
        run: |
          if [ -f www/index.html ]; then
            sed -i 's#<head>#<head>\n<meta name="color-scheme" content="dark light">#' www/index.html
          fi

      - name: Install root dependencies
        run: npm install

      - name: Write capacitor.config.json
        run: |
          if [ "${{ inputs.source_type }}" = "url" ] && [ -n "${{ inputs.website_url }}" ]; then
            cat > capacitor.config.json << EOF
          {
            "appId": "${{ inputs.app_id }}",
            "appName": "${{ inputs.app_name }}",
            "webDir": "www",
            "server": {
              "url": "${{ inputs.website_url }}",
              "cleartext": true
            }
          }
          EOF
          else
            cat > capacitor.config.json << EOF
          {
            "appId": "${{ inputs.app_id }}",
            "appName": "${{ inputs.app_name }}",
            "webDir": "www"
          }
          EOF
          fi

      - name: Remove old android project
        run: rm -rf android

      - name: Add fresh android platform
        run: npx cap add android

      - name: Apply logo if present
        run: |
          if [ -f resources/icon.png ]; then
            npm install @capacitor/assets --save-dev
            npx capacitor-assets generate --android
          fi

      - name: Set version name and code
        run: |
          GRADLE_FILE="android/app/build.gradle"
          if [ -f "$GRADLE_FILE" ]; then
            python3 << 'PYEOF'
          import re
          with open("$GRADLE_FILE", "r") as f:
              content = f.read()
          
          # Replace versionCode and versionName safely
          content = re.sub(r'versionCode\s+\d+', f'versionCode ${{ inputs.version_code }}', content)
          content = re.sub(r'versionName\s+"[^"]*"', f'versionName "${{ inputs.version_name }}"', content)
          
          with open("$GRADLE_FILE", "w") as f:
              f.write(content)
          PYEOF
          fi

      - name: Find package path for MainActivity
        id: pkgpath
        run: |
          PKG_PATH=$(echo "${{ inputs.app_id }}" | tr '.' '/')
          echo "path=$PKG_PATH" >> "$GITHUB_OUTPUT"

      - name: Generate custom MainActivity.java
        run: |
          MAIN_DIR="android/app/src/main/java/${{ steps.pkgpath.outputs.path }}"
          mkdir -p "$MAIN_DIR"
          {
            echo "package ${{ inputs.app_id }};"
            echo ""
            echo "import android.os.Bundle;"
            echo "import android.view.WindowManager;"
            echo "import android.webkit.WebView;"
            echo "import android.webkit.WebSettings;"
            echo "import androidx.appcompat.app.AlertDialog;"
            echo "import com.getcapacitor.BridgeActivity;"
            echo ""
            echo "public class MainActivity extends BridgeActivity {"
            echo "    @Override"
            echo "    public void onCreate(Bundle savedInstanceState) {"
            echo "        super.onCreate(savedInstanceState);"
            echo "        WebView webView = this.bridge.getWebView();"
            echo "        WebSettings settings = webView.getSettings();"

            if [ "${{ inputs.pc_mode }}" = "true" ]; then
              echo "        settings.setUserAgentString(\"Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36\");"
            fi

            if [ "${{ inputs.fullscreen }}" = "true" ]; then
              echo "        getWindow().setFlags(WindowManager.LayoutParams.FLAG_FULLSCREEN, WindowManager.LayoutParams.FLAG_FULLSCREEN);"
            fi

            echo "    }"

            if [ "${{ inputs.exit_confirmation }}" = "true" ]; then
              echo ""
              echo "    @Override"
              echo "    public void onBackPressed() {"
              echo "        if (this.bridge.getWebView().canGoBack()) {"
              echo "            this.bridge.getWebView().goBack();"
              echo "            return;"
              echo "        }"
              echo "        new AlertDialog.Builder(this)"
              echo "            .setMessage(\"অ্যাপ থেকে বের হতে চান?\")"
              echo "            .setPositiveButton(\"হ্যাঁ\", (dialog, which) -> MainActivity.super.onBackPressed())"
              echo "            .setNegativeButton(\"না\", null)"
              echo "            .show();"
              echo "    }"
            fi

            echo "}"
          } > "$MAIN_DIR/MainActivity.java"
          echo "---- Generated MainActivity.java ----"
          cat "$MAIN_DIR/MainActivity.java"

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build APK
        run: |
          cd android
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
